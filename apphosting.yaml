runtime: nodejs20

scripts:
  buildCommand: npm run build
  runCommand: node .output/server/index.mjs

runConfig:
  minInstances: 0
  maxInstances: 2

# Firebase web config is public by design — it ships in the client bundle and
# is protected by Firestore/Storage security rules, not by secrecy. VITE_* vars
# are inlined at build time, so they must be available during BUILD.
# Server-only secrets (FIREBASE_PRIVATE_KEY, PHONEPE_CLIENT_SECRET, DeepSeek key)
# do NOT belong here — set those as secrets in Secret Manager and reference them
# with `secret:` instead of `value:`.
env:
  - variable: VITE_FIREBASE_API_KEY
    value: AIzaSyBMYMS7dv6cSfSq2O5VrUH2mqlya64eByg
    availability:
      - BUILD
      - RUNTIME
  - variable: VITE_FIREBASE_AUTH_DOMAIN
    value: myfamily-a5ec1.firebaseapp.com
    availability:
      - BUILD
      - RUNTIME
  - variable: VITE_FIREBASE_PROJECT_ID
    value: myfamily-a5ec1
    availability:
      - BUILD
      - RUNTIME
  - variable: VITE_FIREBASE_STORAGE_BUCKET
    value: myfamily-a5ec1.firebasestorage.app
    availability:
      - BUILD
      - RUNTIME
  - variable: VITE_FIREBASE_MESSAGING_SENDER_ID
    value: "543100043664"
    availability:
      - BUILD
      - RUNTIME
  - variable: VITE_FIREBASE_APP_ID
    value: "1:543100043664:web:2a7de34bf26315041b7315"
    availability:
      - BUILD
      - RUNTIME
  - variable: VITE_FIREBASE_MEASUREMENT_ID
    value: G-NQX8XGZ7MC
    availability:
      - BUILD
      - RUNTIME
  - variable: VITE_USE_FIREBASE_EMULATORS
    value: "false"
    availability:
      - BUILD
      - RUNTIME
