runtime: nodejs20

env:
  - name: VITE_GEMINI_API_KEY
    value: ${{ secrets.VITE_GEMINI_API_KEY }}
  - name: VITE_FIREBASE_API_KEY
    value: ${{ secrets.VITE_FIREBASE_API_KEY }}
  - name: VITE_FIREBASE_AUTH_DOMAIN
    value: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
  - name: VITE_FIREBASE_PROJECT_ID
    value: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
  - name: VITE_FIREBASE_STORAGE_BUCKET
    value: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
  - name: VITE_FIREBASE_MESSAGING_SENDER_ID
    value: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
  - name: VITE_FIREBASE_APP_ID
    value: ${{ secrets.VITE_FIREBASE_APP_ID }}
  - name: VITE_STRIPE_PUBLISHABLE_KEY
    value: ${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY }}
